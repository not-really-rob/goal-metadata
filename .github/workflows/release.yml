name: Release Goal Metadata

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      existing_version:
        description: Published version to verify and attest, or leave blank to build from main
        type: string

permissions: {}

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXISTING_VERSION: ${{ inputs.existing_version }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build installation files
        id: build
        shell: bash
        run: |
          mkdir release
          files=(main.js manifest.json styles.css)
          if [[ -n "$EXISTING_VERSION" ]]; then
            [[ "$EXISTING_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
            tag="refs/tags/$EXISTING_VERSION"
            git fetch --no-tags origin "$tag:$tag"
            for file in "${files[@]}"; do
              git show "$tag:$file" > "release/$file"
            done
          else
            cp "${files[@]}" release/
          fi
          node --check release/main.js
          test -s release/styles.css
          version=$(node -e '
            const manifest = require("./release/manifest.json");
            if (manifest.id !== "goal-metadata" ||
                typeof manifest.version !== "string" ||
                !/^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/.test(manifest.version)) {
              throw new Error("Expected a Goal Metadata manifest with a numeric version");
            }
            process.stdout.write(manifest.version);
          ')
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [[ -n "$EXISTING_VERSION" ]]; then
            [[ "$version" == "$EXISTING_VERSION" ]]
            mkdir published
            gh release download "$version" --dir published \
              --pattern main.js --pattern manifest.json --pattern styles.css
            for file in "${files[@]}"; do
              cmp "release/$file" "published/$file"
            done
            echo "attest=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          releases=$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')
          if grep -Fxq "$version" <<< "$releases"; then
            echo "Release $version already exists. Change manifest.json to publish a new version."
            exit 0
          fi
          tag="refs/tags/$version"
          if [[ -n "$(git ls-remote --refs origin "$tag")" ]]; then
            git fetch --no-tags origin "$tag:$tag"
            [[ "$(git rev-parse "$tag^{commit}")" == "$GITHUB_SHA" ]]
          fi
          echo "attest=true" >> "$GITHUB_OUTPUT"
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Attest installation files
        if: steps.build.outputs.attest == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Publish GitHub release
        if: steps.build.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.build.outputs.version }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" \
            --title "Goal Metadata $VERSION" --generate-notes \
            release/main.js release/manifest.json release/styles.css
